spring.application.name=auth-api
# 1. Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/authapi_db
spring.datasource.username=root

# Le mot de passe est sécurisé via variable d'environnement (comme appris précédemment)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate (Génération automatique des tables)
spring.jpa.hibernate.ddl-auto=update

# 3. Afficher les requêtes SQL dans la console (pratique pour le débogage)
spring.jpa.show-sql=true